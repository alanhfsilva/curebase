services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: curebase
      POSTGRES_PASSWORD: curebase
      POSTGRES_DB: curebase
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curebase"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
